name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax-check:
    name: Python Syntax & Imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: |
          python -m py_compile webui/server.py
          python -m py_compile webui/dashboard.py
          python -m py_compile webui/wavespeed_tiktok_client.py
          python -m py_compile pipeline/pipeline.py
          python -m py_compile pipeline/prompt_bank.py
          python -m py_compile pipeline/wavespeed_i2v_client.py
          python -m py_compile api/wavespeed_client.py
          python -m py_compile core/config.py
          python -m py_compile core/daybatch.py
          python -m py_compile core/errors.py
          python -m py_compile core/text_generator.py
          python -m py_compile scripts/run_tiktok.py
          python -m py_compile scripts/alina_textgen.py
          python -m py_compile scripts/backfill_prompts.py
          python -m py_compile scripts/open_dashboard.py
          python -m py_compile scripts/open_server.py
          python -m py_compile scripts/save_meta.py
          python -m py_compile scripts/update_config.py
          python -m py_compile hot-take-influencer/scripts/wavespeed_client.py

  import-test:
    name: Basic Import Test
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Test core imports
        run: |
          python -c "import core.config; import core.daybatch; import core.errors; import core.text_generator; print('core OK')"
          python -c "import pipeline.pipeline; import pipeline.prompt_bank; print('pipeline OK')"
          python -c "import webui.server; import webui.wavespeed_tiktok_client; print('webui OK')"
          python -c "import api.wavespeed_client; print('api OK')"
          python -c "import sys; sys.path.insert(0, 'scripts'); import alina_textgen; print('scripts OK')"

  frontend-lint:
    name: Frontend Basic Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML/CSS/JS exist
        run: |
          test -f webui/static/index.html
          test -f webui/static/style.css
          test -f webui/static/app.js
          echo "Frontend files present"
      - name: Check JS syntax
        run: node --check webui/static/app.js